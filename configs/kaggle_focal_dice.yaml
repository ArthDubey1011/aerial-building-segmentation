# Kaggle GPU config, experiment 2: Focal + Dice loss. Identical to experiment 1 except the loss + name.
experiment_name: kaggle_focal_dice
seed: 42

data:
  root: /kaggle/input/massachusetts-buildings-dataset/png
  train_images: train
  train_masks: train_labels
  val_images: val
  val_masks: val_labels
  test_images: test
  test_masks: test_labels
  mask_threshold: 127
  blank_max_fraction: 0.5
  crop_size: 512
  crops_per_epoch: 400
  max_resample_tries: 10

model:
  encoder: resnet34
  encoder_weights: imagenet
  classes: 1

loss:
  name: focal_dice

train:
  epochs: 40                # estimate ~15 min on a T4; check epoch time in the first log lines and adjust
  batch_size: 8
  lr: 0.0003
  num_workers: 2
  mixed_precision: true
  threshold: 0.5

infer:
  tile_size: 512
  overlap: 128

output:
  results_dir: results
